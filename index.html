<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17161a" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="朝闻汇集国内外一百余家媒体、通讯社与机构的公开报道，标明出处，外文附中文译文，多家来源报道同一事件时自动归并，按分类、地区、话题多重筛选。" />
  <meta property="og:title" content="朝闻 · 综合新闻" />
  <meta property="og:description" content="汇集国内外百余家来源的综合新闻，标明出处，多源归并，外文附译文。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>朝闻 · 综合新闻</title>
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("zw.prefs") || "{}");
        var t = p.theme || "auto";
        if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.size = p.size || "m";
        document.documentElement.dataset.density = p.density || "cozy";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>

  <div class="utility">
    <div class="wrap utility-in">
      <p class="dateline" id="dateline"></p>
      <p class="updated" id="updated">正在载入…</p>
      <div class="utility-actions">
        <button type="button" class="u-btn" id="btn-brief" title="今日简报">简报</button>
        <button type="button" class="u-btn" id="btn-sources" title="来源一览">来源</button>
        <button type="button" class="u-btn" id="btn-share-view" title="复制当前页面链接">分享此页</button>
        <button type="button" class="u-btn" id="btn-about">关于</button>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap mast-in">
      <a class="brand" href="./" aria-label="朝闻首页">
        <svg class="sun" viewBox="0 0 64 40" aria-hidden="true">
          <path d="M14 30a18 18 0 0 1 36 0" fill="currentColor" />
          <path d="M4 34h56M12 38.5h40" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M32 4v5M15.5 11l3.2 3.6M48.5 11l-3.2 3.6M6.5 22.5l4.6 1.6M57.5 22.5l-4.6 1.6" />
          </g>
        </svg>
        <span class="wordmark">朝闻</span>
      </a>
      <p class="motto">汇百家之报道，存一事之全貌</p>
      <div class="mast-actions">
        <label class="search" for="q">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l5 5" /></svg>
          <input id="q" type="search" placeholder="搜索新闻、话题或来源" autocomplete="off" enterkeyhint="search" />
          <kbd>/</kbd>
        </label>
        <button type="button" class="icon-btn" id="btn-theme" aria-label="切换深浅色">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4" /></svg>
        </button>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="阅读设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
        </button>
      </div>
    </div>
  </header>

  <nav class="sections" aria-label="栏目">
    <div class="wrap sections-in" id="sections"></div>
  </nav>

  <main id="main" class="wrap">
    <div id="notice" class="notice" hidden></div>
    <section id="view-home" class="view" hidden></section>
    <section id="view-list" class="view" hidden>
      <div class="list-layout">
        <aside class="filters" id="filters" aria-label="筛选">
          <div class="filters-head">
            <strong>筛选</strong>
            <button type="button" class="link-btn" id="btn-reset">清除</button>
            <button type="button" class="icon-btn sm only-mobile" id="btn-close-filters" aria-label="关闭筛选">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <div id="filter-body"></div>
          <div class="filters-foot only-mobile">
            <button type="button" class="primary-btn" id="btn-apply">查看结果</button>
          </div>
        </aside>
        <div class="filters-mask" id="filters-mask" hidden></div>
        <div class="list-main">
          <div class="list-head">
            <div class="list-title">
              <h1 id="list-title">全部新闻</h1>
              <p id="list-count" class="muted"></p>
            </div>
            <div class="toolbar">
              <div class="seg" id="sort-seg" role="tablist" aria-label="排序">
                <button type="button" data-sort="hot">热度</button>
                <button type="button" data-sort="new">最新</button>
                <button type="button" data-sort="cover">报道数</button>
                <button type="button" data-sort="source">来源</button>
              </div>
              <button type="button" class="chip-btn only-mobile" id="btn-filter">筛选<span class="badge" id="filter-badge" hidden></span></button>
            </div>
          </div>
          <div class="active-bar" id="active-bar" hidden></div>
          <div id="list" class="cards"></div>
          <div id="sentinel" class="sentinel"></div>
        </div>
      </div>
    </section>
    <section id="view-timeline" class="view" hidden></section>
    <section id="view-mine" class="view" hidden></section>
    <section id="view-sources" class="view" hidden></section>
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <p>朝闻只收录各来源公开发布的标题与摘要，正文请点击前往原网站阅读，版权归原作者所有。外文译文为机器翻译，仅供参考。</p>
      <p class="muted" id="foot-stats"></p>
    </div>
  </footer>

  <button type="button" class="to-top" id="to-top" aria-label="回到顶部" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6" /></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dlg" class="dlg">
    <div class="dlg-in">
      <header class="dlg-head">
        <h2 id="dlg-title"></h2>
        <button type="button" class="icon-btn sm" id="dlg-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>
      <div id="dlg-body" class="dlg-body"></div>
    </div>
  </dialog>

  <script src="assets/app.js" defer></script>
</body>
</html>
